[project]
name = "folio-backend"
version = "0.1.0"
description = "Folio — Smart Personal Library System backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.21",
    "chromadb>=0.5.0",
    "pymupdf>=1.24.0",
    "ebooklib>=0.18",
    "pillow>=10.0.0",
    "simhash>=2.1.2",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=2.8.0",
    "paddlepaddle>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
